name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/AirWave/AirWave.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$v -o publish

      - name: Installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$p\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH += ";$p"
          }
          iscc /Q /DAppVersion=$v /DSourceExe=..\publish\AirWave.exe installer\AirWave.iss
          Copy-Item publish\AirWave.exe "AirWave-$v-portable.exe"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $notes = if (Test-Path "release-notes\$v.md") { "release-notes\$v.md" } else { $null }
          $args = @("${{ github.ref_name }}", "installer\Output\AirWave-Setup-$v.exe", "AirWave-$v-portable.exe", "--title", "AirWave $v")
          if ($notes) { $args += @("--notes-file", $notes) } else { $args += "--generate-notes" }
          gh release create @args
