name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build AirWave.sln -c Release

      - name: Unit checks (crypto, pairing, ALAC, Windows AAC decoder)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          dotnet run --project src/AirWave.TestCli -c Release --no-build -- unit 2>&1 | Tee-Object -FilePath "$dir\unit.txt"
          if ($LASTEXITCODE -ne 0) { throw "Unit checks failed" }

      - name: Virtual sound card (for the playback test)
        uses: LABSN/sound-ci-helpers@v1

      - name: Muting this PC doesn't silence the speakers
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          python -c "import wave,math,struct; w=wave.open(r'$dir\tone.wav','wb'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',v,v) for v in (int(12000*math.sin(2*math.pi*440*i/44100)) for i in range(44100*20)))); w.close()"
          $player = New-Object System.Media.SoundPlayer "$dir\tone.wav"
          $player.PlayLooping()
          $cli = "src\AirWave.TestCli\bin\Release\net8.0\AirWave.TestCli.exe"
          & $cli capture-test 2>&1 | Tee-Object -FilePath "$dir\capture-test.txt"
          $code = $LASTEXITCODE
          $player.Stop()
          Get-Content "$dir\capture-test.txt" | Where-Object { $_ -match 'CAPTURE|PASS|FAIL' } | ForEach-Object { "::notice::$_" }
          if ($code -ne 0) { throw "Capture while muted failed" }

      - name: AirPlay to this PC through Windows audio
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $cli = "src\AirWave.TestCli\bin\Release\net8.0\AirWave.TestCli.exe"
          $rx = Start-Process $cli -ArgumentList "receive","--name","CI-AirWave","--render","--seconds","40","--debug" -RedirectStandardOutput "$dir\render-rx.txt" -RedirectStandardError "$dir\render-rx-err.txt" -PassThru
          Start-Sleep 6
          & $cli send-buffered 127.0.0.1:7000 --aac tests\data\beeps.adts --seconds 12 --ptp-any-port 2>&1 | Tee-Object -FilePath "$dir\render-tx.txt"
          Start-Sleep 2
          Stop-Process -Id $rx.Id -ErrorAction SilentlyContinue
          python tests\windows\check_render.py "$dir\render-rx.txt" "$dir\render-tx.txt" 2>&1 | Tee-Object -FilePath "$dir\render-result.txt"
          if ($LASTEXITCODE -ne 0) { throw "Playback test failed" }

      - name: AAC encoder for HomePods and Apple TVs
        shell: pwsh
        run: |
          $cli = "src\AirWave.TestCli\bin\Release\net8.0\AirWave.TestCli.exe"
          & $cli aac-delay --debug 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\selftest\aac-delay.txt"
          if ($LASTEXITCODE -ne 0) { throw "AAC encoder not working" }

      - name: HomePods keep time, other speakers follow AirWave
        shell: pwsh
        run: |
          $cli = "src\AirWave.TestCli\bin\Release\net8.0\AirWave.TestCli.exe"
          & $cli ptp-yield 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\selftest\ptp-yield.txt"
          if ($LASTEXITCODE -ne 0) { throw "Per-speaker timekeeping wrong" }

      - name: Screen mirroring from Windows (to a stand-in TV)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          $cli = "src\AirWave.TestCli\bin\Release\net8.0\AirWave.TestCli.exe"
          # Something to look at on screen
          Start-Process notepad
          Start-Sleep 2
          $tv = Start-Process $cli -ArgumentList "mock-tv","--mode","pin","--port","7150","--out","$dir\mirror.h264","--seconds","40" -RedirectStandardOutput "$dir\mirror-tv.txt" -RedirectStandardError "$dir\mirror-tv-err.txt" -PassThru
          Start-Sleep 3
          # Default settings: graphics card path, falling back automatically when there's no GPU encoder (CI has none)
          & $cli mirror-test 127.0.0.1:7150 --screen 10 --audio --pin-value 4821 --pair-dir "$env:RUNNER_TEMP\pair" 2>&1 | Tee-Object -FilePath "$dir\mirror-tx.txt"
          $code = $LASTEXITCODE
          Start-Sleep 2
          Stop-Process -Id $tv.Id -ErrorAction SilentlyContinue
          if ($code -ne 0) { Stop-Process -Name notepad -ErrorAction SilentlyContinue; throw "Screen mirroring failed" }
          # Graphics card encoder switched off: the standard capture and encoder
          $tv = Start-Process $cli -ArgumentList "mock-tv","--mode","pin","--port","7151","--out","$dir\mirror-std.h264","--seconds","30" -RedirectStandardOutput "$dir\mirror-std-tv.txt" -RedirectStandardError "$dir\mirror-std-tv-err.txt" -PassThru
          Start-Sleep 3
          & $cli mirror-test 127.0.0.1:7151 --screen 6 --no-gpu --expect-encoder "Processor (software)" --pin-value 4821 --pair-dir "$env:RUNNER_TEMP\pair2" 2>&1 | Tee-Object -FilePath "$dir\mirror-std-tx.txt"
          $code = $LASTEXITCODE
          Start-Sleep 2
          Stop-Process -Id $tv.Id -ErrorAction SilentlyContinue
          Stop-Process -Name notepad -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "Screen mirroring (standard encoder) failed" }

      - name: Publish (single file, no .NET install needed)
        run: >
          dotnet publish src/AirWave/AirWave.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $p = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$p\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
            $env:PATH += ";$p"
          }
          iscc /Q /DAppVersion=0.0.0-ci /DSourceExe=..\publish\AirWave.exe installer\AirWave.iss
          Get-ChildItem installer\Output
          # Install silently for this user, check it's there, then uninstall
          $setup = (Get-ChildItem installer\Output\*.exe)[0].FullName
          Start-Process $setup -ArgumentList "/VERYSILENT","/CURRENTUSER","/NORESTART","/SUPPRESSMSGBOXES" -Wait
          $exe = "$env:LOCALAPPDATA\Programs\AirWave\AirWave.exe"
          if (-not (Test-Path $exe)) { throw "Installer didn't install AirWave.exe" }
          # In-app update of the installed copy: AirWave runs the installer quietly, which restarts it
          $m = "$env:RUNNER_TEMP\update-installed.txt"
          $env:AIRWAVE_STARTED_MARKER = $m; $env:AIRWAVE_TEST_UPDATE = $setup
          Start-Process $exe -ArgumentList "--tray"
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) { Start-Sleep 1; $ok = (Test-Path $m) -and (Select-String -Path $m -Pattern "--after-update" -Quiet) }
          Remove-Item Env:AIRWAVE_STARTED_MARKER, Env:AIRWAVE_TEST_UPDATE
          Get-Content $m -ErrorAction SilentlyContinue | Tee-Object -FilePath "$env:RUNNER_TEMP\selftest\update-installed.txt"
          Stop-Process -Name AirWave -ErrorAction SilentlyContinue; Start-Sleep 2
          if (-not $ok) { throw "In-app update (installed copy) didn't restart AirWave" }
          $un = "$env:LOCALAPPDATA\Programs\AirWave\unins000.exe"
          Start-Process $un -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path $exe) { throw "Uninstaller left AirWave.exe behind" }
          "installer: install and uninstall OK" | Tee-Object -FilePath "$env:RUNNER_TEMP\selftest\installer.txt"

      - name: In-app update of the portable .exe
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\portable"
          New-Item -ItemType Directory $t | Out-Null
          Copy-Item publish\AirWave.exe "$t\AirWave.exe"
          Copy-Item publish\AirWave.exe "$t\AirWave-new-portable.exe"
          $m = "$t\marker.txt"
          $env:AIRWAVE_STARTED_MARKER = $m; $env:AIRWAVE_TEST_UPDATE = "$t\AirWave-new-portable.exe"
          Start-Process "$t\AirWave.exe" -ArgumentList "--tray"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep 1; $ok = (Test-Path $m) -and (Select-String -Path $m -Pattern "--after-update" -Quiet) }
          Start-Sleep 25  # the restarted copy tidies up the old .exe once it's running
          Remove-Item Env:AIRWAVE_STARTED_MARKER, Env:AIRWAVE_TEST_UPDATE
          $left = Test-Path "$t\AirWave.exe.old"
          (Get-Content $m -ErrorAction SilentlyContinue) + "old exe left behind: $left" | Tee-Object -FilePath "$env:RUNNER_TEMP\selftest\update-portable.txt"
          Stop-Process -Name AirWave -ErrorAction SilentlyContinue; Start-Sleep 2
          if (-not $ok) { throw "In-app update (portable) didn't restart AirWave" }
          if ($left) { throw "The old .exe wasn't tidied up" }

      - name: Self-test (opens the app, screenshots every page)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          $p = Start-Process publish\AirWave.exe -ArgumentList "--self-test", $dir -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Self-test timed out" }
          Get-Content "$dir\result.txt"
          if (-not (Select-String -Path "$dir\result.txt" -Pattern "PASSED" -Quiet)) {
            if (Test-Path "$dir\crash.txt") { Get-Content "$dir\crash.txt" }
            throw "Self-test failed"
          }

      - name: Save screenshots to the 'screenshots' branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\selftest"
          if (-not (Test-Path $dir)) { exit 0 }
          $ws = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory $ws | Out-Null
          Copy-Item "$dir\*" $ws
          Set-Location $ws
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: ${{ runner.temp }}\selftest

      - uses: actions/upload-artifact@v4
        with:
          name: AirWave-win-x64
          path: |
            publish\AirWave.exe
            installer\Output\*.exe
